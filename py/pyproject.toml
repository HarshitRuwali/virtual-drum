[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vdrum"
version = "0.1.0"
description = "Headless webcam air-drum detection core (virtual-drum, PLAN.md)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "mediapipe==1.0.1",
  "opencv-contrib-python-headless>=4.10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vdrum = "vdrum.cli:main"

[tool.setuptools.packages.find]
where = ["py"]

[tool.pytest.ini_options]
testpaths = ["py/tests"]
addopts = "-q"
