<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>virtual drum</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b1020; color: #e2e8f0;
        font-family: system-ui, sans-serif; }
      #wrap { position: relative; width: 100vw; height: 100vh; }
      video, canvas { position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: cover; }
      video { transform: scaleX(-1); visibility: hidden; }
      #top { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px;
        display: flex; gap: 16px; align-items: center; background: rgba(11, 16, 32, 0.7);
        backdrop-filter: blur(6px); }
      button { padding: 8px 14px; border-radius: 8px; border: 1px solid #334155;
        background: #1e293b; color: #e2e8f0; cursor: pointer; font-size: 14px; }
      button:hover { background: #273449; }
      label { font-size: 13px; color: #94a3b8; }
      input[type="range"] { width: 160px; }
      #status { margin-left: auto; font-size: 13px; color: #94a3b8; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <video id="video" muted playsinline></video>
      <canvas id="zones"></canvas>
      <div id="top">
        <button id="start">start</button>
        <button id="metro" disabled>start metronome</button>
        <label>bpm <input id="bpm" type="range" min="40" max="200" value="80" disabled />
          <span id="bpm-label">80</span></label>
        <span id="status">press start</span>
      </div>
    </div>
    <script type="module">
      import { startApp } from "/src/main.ts";
      document.getElementById("start").addEventListener("click", () => {
        const btn = document.getElementById("start");
        btn.disabled = true;
        document.getElementById("metro").disabled = false;
        document.getElementById("bpm").disabled = false;
        void startApp().catch((err) => {
          document.getElementById("status").textContent = `error: ${String(err)}`;
          btn.disabled = false;
        });
      });
    </script>
  </body>
</html>
